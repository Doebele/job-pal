services:
  job-pal-db:
    image: postgres:16-alpine
    container_name: job-pal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-jobpal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobpal_secret}
      POSTGRES_DB: ${DB_NAME:-jobpal}
    ports:
      - "${DB_EXTERNAL_PORT:-5435}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jobpal} -d ${DB_NAME:-jobpal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-pal

  job-pal-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: job-pal-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-job-pal-db}
      DB_USER: ${DB_USER:-jobpal}
      DB_PASSWORD: ${DB_PASSWORD:-jobpal_secret}
      DB_NAME: ${DB_NAME:-jobpal}
      DB_PORT: ${DB_INTERNAL_PORT:-5432}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_secret_min_32_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NODE_ENV: ${NODE_ENV:-development}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@jobpal.ch}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      job-pal-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - job-pal

  job-pal-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: job-pal-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - job-pal-backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - job-pal

volumes:
  db-data:

networks:
  job-pal:
    driver: bridge
